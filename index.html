<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebsimKids Playground</title>

        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
    </div>
    
    <div class="ground"></div>
    
    <div class="playground">
        <div class="sandbox">
            <div class="sand"></div>
            <div class="bucket"></div>
            <div class="shovel"></div>
        </div>
        
        <div class="swing-set">
            <div class="swing-seat"></div>
        </div>
        
        <div class="slide">
            <div class="slide-top"></div>
            <div class="slide-bottom"></div>
        </div>
        
        <div class="seesaw">
            <div class="seesaw-left"></div>
            <div class="seesaw-right"></div>
            <div class="seesaw-base"></div>
        </div>
        
        <div class="ball"></div>
    </div>
    
    <div class="character">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arms"></div>
        <div class="legs"></div>
    </div>
    
    <div class="sun"></div>
